<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIエージェント">
<title>AIエージェント</title>
<style>
/* ===== ベース ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
  font-size: 16px;
  background: #F2F2F7;
  color: #000;
  overflow: hidden;
}

/* ライト/ダーク変数 */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text: #000000;
  --text-sub: #8E8E93;
  --border: #E5E5EA;
  --accent: #007AFF;
  --user-bubble: #007AFF;
  --user-text: #FFFFFF;
  --ai-bubble: #E5E5EA;
  --ai-text: #000000;
  --tab-bg: rgba(249, 249, 249, 0.94);
  --tab-border: rgba(0, 0, 0, 0.1);
  --error: #FF3B30;
  --success: #34C759;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --text: #FFFFFF;
    --text-sub: #8E8E93;
    --border: #38383A;
    --accent: #0A84FF;
    --user-bubble: #0A84FF;
    --user-text: #FFFFFF;
    --ai-bubble: #2C2C2E;
    --ai-text: #FFFFFF;
    --tab-bg: rgba(28, 28, 30, 0.94);
    --tab-border: rgba(255, 255, 255, 0.1);
    --error: #FF453A;
    --success: #30D158;
  }
}
body { background: var(--bg); color: var(--text); }

/* ===== レイアウト ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding-top: env(safe-area-inset-top);
}
.screen {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
  flex-direction: column;
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}
.screen.active { display: flex; }

/* ===== ヘッダー ===== */
.header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  font-size: 17px;
  font-weight: 600;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 5;
}

/* ===== タブバー ===== */
.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  display: flex;
  background: var(--tab-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--tab-border);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 10;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 4px;
  cursor: pointer;
  color: var(--text-sub);
  font-size: 11px;
  border: none;
  background: none;
  font-family: inherit;
}
.tab.active { color: var(--accent); }
.tab svg { width: 24px; height: 24px; }

/* ===== チャット画面 ===== */
.chat-list {
  flex: 1;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 100%;
}
.bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 18px;
  word-wrap: break-word;
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 16px;
}
.bubble.user {
  align-self: flex-end;
  background: var(--user-bubble);
  color: var(--user-text);
  border-bottom-right-radius: 4px;
}
.bubble.ai {
  align-self: flex-start;
  background: var(--ai-bubble);
  color: var(--ai-text);
  border-bottom-left-radius: 4px;
}
.bubble.error {
  align-self: center;
  background: var(--error);
  color: #fff;
  font-size: 14px;
  border-radius: 12px;
  text-align: center;
  max-width: 90%;
}
.bubble.system {
  align-self: center;
  background: transparent;
  color: var(--text-sub);
  font-size: 13px;
  text-align: center;
  padding: 8px;
  max-width: 90%;
}
.timestamp {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 2px;
}
.user .timestamp { text-align: right; }

/* ローディング */
.loading-dots {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.loading-dots span {
  width: 8px; height: 8px;
  background: var(--text-sub);
  border-radius: 50%;
  animation: dot 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes dot {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* チャット入力 */
.chat-input-area {
  position: fixed;
  bottom: calc(60px + env(safe-area-inset-bottom));
  left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 8px 12px;
  display: none;
  gap: 8px;
  align-items: flex-end;
  z-index: 9;
}
.chat-input-area.show { display: flex; }
.chat-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 16px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  resize: none;
  max-height: 120px;
  min-height: 40px;
  line-height: 1.4;
  outline: none;
}
.chat-input:focus { border-color: var(--accent); }
.send-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.send-btn svg { width: 20px; height: 20px; }

/* チャット画面のときだけ入力欄を表示するための余白 */
#screen-chat { padding-bottom: calc(60px + 56px + env(safe-area-inset-bottom)); }

/* ===== 設定画面・他 ===== */
.settings-content {
  padding: 16px;
}
.section {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.section h3 {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 500;
}
.field input, .field textarea, .field select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--accent);
}
.field textarea {
  resize: vertical;
  min-height: 80px;
  font-size: 14px;
  line-height: 1.5;
}
.field .hint {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 4px;
}
.btn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  background: var(--accent);
  color: white;
}
.btn:active { opacity: 0.7; }
.btn-secondary {
  background: var(--card);
  color: var(--accent);
  border: 1px solid var(--border);
}
.btn-danger {
  background: var(--error);
  color: white;
}

/* トースト */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0, 0, 0, 0.85);
  color: white;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 14px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast.error { background: var(--error); }
.toast.success { background: var(--success); }

/* placeholder用画面 */
.placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
  color: var(--text-sub);
}
.placeholder h2 {
  font-size: 20px;
  margin-bottom: 8px;
  color: var(--text);
}
.placeholder p {
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
}

/* APIキー未設定の案内 */
.api-warning {
  background: #FFE5E5;
  color: #C00;
  padding: 12px;
  border-radius: 10px;
  margin: 12px;
  font-size: 14px;
  text-align: center;
}
@media (prefers-color-scheme: dark) {
  .api-warning {
    background: rgba(255, 69, 58, 0.2);
    color: #FF6961;
  }
}
</style>
</head>
<body>

<div id="app">

  <!-- チャット画面 -->
  <div id="screen-chat" class="screen active">
    <div class="header">チャット</div>
    <div id="apiWarning" class="api-warning" style="display:none;">
      ⚠️ APIキーが未設定です。「設定」タブで登録してください。
    </div>
    <div id="chatList" class="chat-list"></div>
  </div>

  <!-- プロフィール画面 -->
  <div id="screen-profile" class="screen">
    <div class="header">プロフィール</div>
    <div class="placeholder">
      <h2>準備中</h2>
      <p>第2段階で実装予定です。<br>まずはチャットを試してみてください。</p>
    </div>
  </div>

  <!-- スケジュール画面 -->
  <div id="screen-schedule" class="screen">
    <div class="header">スケジュール</div>
    <div class="placeholder">
      <h2>準備中</h2>
      <p>第2段階で実装予定です。</p>
    </div>
  </div>

  <!-- 設定画面 -->
  <div id="screen-settings" class="screen">
    <div class="header">設定</div>
    <div class="settings-content">
      <div class="section">
        <h3>Gemini API</h3>
        <div class="field">
          <label>APIキー</label>
          <input type="password" id="inputApiKey" placeholder="AIzaSy...">
          <div class="hint">
            Google AI Studioで取得 →
            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com</a>
          </div>
        </div>
        <div class="field">
          <label>使用モデル</label>
          <select id="inputModel">
            <option value="gemini-2.5-flash">gemini-2.5-flash(推奨・無料枠広い)</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro(高性能)</option>
          </select>
        </div>
      </div>

      <div class="section">
        <h3>システムプロンプト</h3>
        <div class="field">
          <textarea id="inputSystemPrompt" rows="6" placeholder="AIへの指示や役割設定を記述..."></textarea>
          <div class="hint">AIの振る舞いを定義します。空欄でも動作します。</div>
        </div>
      </div>

      <button class="btn" id="btnSaveSettings">設定を保存</button>

      <div style="height: 20px;"></div>

      <button class="btn btn-secondary" id="btnClearChat">チャット履歴をクリア</button>
    </div>
  </div>

  <!-- チャット入力エリア(チャット画面の時のみ表示) -->
  <div id="chatInputArea" class="chat-input-area show">
    <textarea id="chatInput" class="chat-input" placeholder="メッセージを入力..." rows="1"></textarea>
    <button id="btnSend" class="send-btn" aria-label="送信">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <!-- タブバー -->
  <nav class="tabbar">
    <button class="tab active" data-screen="chat">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <span>チャット</span>
    </button>
    <button class="tab" data-screen="profile">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>プロフィール</span>
    </button>
    <button class="tab" data-screen="schedule">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
      <span>スケジュール</span>
    </button>
    <button class="tab" data-screen="settings">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0014 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
      <span>設定</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast"></div>

<script>
'use strict';

// ===== 状態管理 =====
const STORAGE_KEYS = {
  settings: 'agent_settings',
  history: 'agent_chat_history'
};

const DEFAULT_SETTINGS = {
  apiKey: '',
  model: 'gemini-2.5-flash',
  systemPrompt: 'あなたはユーザーの相棒となる、親しみやすく親切なAIアシスタントです。自然で温かみのある日本語で対話してください。'
};

let settings = loadSettings();
let chatHistory = loadHistory();
let isWaitingResponse = false;

// ===== ストレージ =====
function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEYS.settings);
    if (!raw) return { ...DEFAULT_SETTINGS };
    return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch (e) {
    console.error('Settings load failed', e);
    return { ...DEFAULT_SETTINGS };
  }
}
function saveSettings() {
  localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
}
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEYS.history);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('History load failed', e);
    return [];
  }
}
function saveHistory() {
  localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(chatHistory));
}

// ===== トースト =====
function showToast(message, type = '') {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'toast show ' + type;
  setTimeout(() => { el.className = 'toast ' + type; }, 2400);
}

// ===== タブ切替 =====
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  const screen = document.getElementById('screen-' + name);
  const tab = document.querySelector('.tab[data-screen="' + name + '"]');
  if (screen) screen.classList.add('active');
  if (tab) tab.classList.add('active');

  // チャット画面の時だけ入力欄表示
  const inputArea = document.getElementById('chatInputArea');
  if (name === 'chat') {
    inputArea.classList.add('show');
    setTimeout(scrollChatToBottom, 50);
  } else {
    inputArea.classList.remove('show');
  }
}
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchScreen(tab.dataset.screen));
});

// ===== チャット表示 =====
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function formatTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}
function renderChat() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';

  if (chatHistory.length === 0) {
    const sys = document.createElement('div');
    sys.className = 'bubble system';
    sys.textContent = 'メッセージを送信してAIと対話を始めましょう';
    list.appendChild(sys);
    return;
  }

  chatHistory.forEach(msg => {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (msg.role === 'user' ? 'user' : 'ai');
    bubble.textContent = msg.content;

    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.alignItems = msg.role === 'user' ? 'flex-end' : 'flex-start';
    wrap.appendChild(bubble);

    if (msg.timestamp) {
      const ts = document.createElement('div');
      ts.className = 'timestamp';
      ts.textContent = formatTime(msg.timestamp);
      wrap.appendChild(ts);
    }
    list.appendChild(wrap);
  });
}
function appendLoading() {
  const list = document.getElementById('chatList');
  const wrap = document.createElement('div');
  wrap.id = 'loadingBubble';
  wrap.style.alignSelf = 'flex-start';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ai';
  bubble.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';
  wrap.appendChild(bubble);
  list.appendChild(wrap);
  scrollChatToBottom();
}
function removeLoading() {
  const el = document.getElementById('loadingBubble');
  if (el) el.remove();
}
function appendError(text) {
  const list = document.getElementById('chatList');
  const div = document.createElement('div');
  div.className = 'bubble error';
  div.textContent = text;
  list.appendChild(div);
  scrollChatToBottom();
}
function scrollChatToBottom() {
  const screen = document.getElementById('screen-chat');
  screen.scrollTop = screen.scrollHeight;
}

// ===== Gemini API =====
async function callGemini(userMessage) {
  if (!settings.apiKey) {
    throw new Error('APIキーが設定されていません');
  }

  // 直近8件の履歴をコンテキストに
  const recent = chatHistory.slice(-8);
  const contents = recent.map(m => ({
    role: m.role === 'ai' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  // 今回のユーザーメッセージを追加
  contents.push({
    role: 'user',
    parts: [{ text: userMessage }]
  });

  const body = {
    contents: contents,
    generationConfig: {
      temperature: 0.7,
      maxOutputTokens: 2048
    }
  };
  if (settings.systemPrompt && settings.systemPrompt.trim()) {
    body.systemInstruction = {
      parts: [{ text: settings.systemPrompt }]
    };
  }

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'
    + encodeURIComponent(settings.model)
    + ':generateContent?key=' + encodeURIComponent(settings.apiKey);

  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!resp.ok) {
    let errMsg = 'API呼び出し失敗 (HTTP ' + resp.status + ')';
    try {
      const errData = await resp.json();
      if (errData.error && errData.error.message) {
        errMsg = errData.error.message;
      }
    } catch {}
    throw new Error(errMsg);
  }

  const data = await resp.json();
  const candidate = data.candidates && data.candidates[0];
  if (!candidate) throw new Error('AIから応答がありませんでした');

  // safety filterで止まった場合
  if (candidate.finishReason === 'SAFETY') {
    throw new Error('安全性フィルタにより応答できませんでした');
  }

  const parts = candidate.content && candidate.content.parts;
  if (!parts || parts.length === 0) throw new Error('応答が空でした');

  const text = parts.map(p => p.text || '').join('').trim();
  if (!text) throw new Error('応答が空でした');

  return text;
}

// ===== 送信処理 =====
async function sendMessage() {
  if (isWaitingResponse) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  if (!settings.apiKey) {
    showToast('APIキーを設定してください', 'error');
    switchScreen('settings');
    return;
  }

  // ユーザーメッセージを追加
  const userMsg = {
    role: 'user',
    content: text,
    timestamp: new Date().toISOString()
  };
  chatHistory.push(userMsg);
  saveHistory();
  renderChat();

  input.value = '';
  input.style.height = 'auto';

  isWaitingResponse = true;
  document.getElementById('btnSend').disabled = true;
  appendLoading();
  scrollChatToBottom();

  try {
    const reply = await callGemini(text);
    chatHistory.push({
      role: 'ai',
      content: reply,
      timestamp: new Date().toISOString()
    });
    saveHistory();
    removeLoading();
    renderChat();
    scrollChatToBottom();
  } catch (e) {
    removeLoading();
    appendError(String(e.message || e));
    console.error(e);
  } finally {
    isWaitingResponse = false;
    document.getElementById('btnSend').disabled = false;
  }
}

// ===== UIイベント =====
document.getElementById('btnSend').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('chatInput').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
});

// 設定画面
document.getElementById('btnSaveSettings').addEventListener('click', () => {
  settings.apiKey = document.getElementById('inputApiKey').value.trim();
  settings.model = document.getElementById('inputModel').value;
  settings.systemPrompt = document.getElementById('inputSystemPrompt').value;
  saveSettings();
  updateApiWarning();
  showToast('設定を保存しました', 'success');
});

document.getElementById('btnClearChat').addEventListener('click', () => {
  if (!confirm('チャット履歴をすべて削除しますか?')) return;
  chatHistory = [];
  saveHistory();
  renderChat();
  showToast('履歴を削除しました', 'success');
});

// APIキー未設定の警告
function updateApiWarning() {
  const warn = document.getElementById('apiWarning');
  warn.style.display = settings.apiKey ? 'none' : 'block';
}

// ===== 初期化 =====
function init() {
  // 設定をフォームに反映
  document.getElementById('inputApiKey').value = settings.apiKey || '';
  document.getElementById('inputModel').value = settings.model || DEFAULT_SETTINGS.model;
  document.getElementById('inputSystemPrompt').value = settings.systemPrompt || '';

  renderChat();
  updateApiWarning();

  // APIキー未設定なら設定タブへ誘導
  if (!settings.apiKey) {
    setTimeout(() => switchScreen('settings'), 100);
  }
}

init();
</script>
</body>
</html>
